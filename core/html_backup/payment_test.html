<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eSIM Payment Test - Taurixy Integration</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0A2E2A 0%, #3A6351 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: #0A2E2A;
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 2.5em;
            color: #F9C80E;
        }
        .header p {
            margin: 10px 0 0 0;
            opacity: 0.9;
        }
        .content {
            padding: 40px;
        }
        .payment-form {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #0A2E2A;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #F9C80E;
        }
        .btn {
            background: #F9C80E;
            color: #0A2E2A;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }
        .btn:hover {
            background: #e6b800;
            transform: translateY(-2px);
        }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }
        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .result.info {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }
        .plan-card {
            background: white;
            border: 2px solid #F9C80E;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .plan-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(249, 200, 14, 0.3);
        }
        .plan-card.selected {
            background: #F9C80E;
            color: #0A2E2A;
        }
        .plan-price {
            font-size: 2em;
            font-weight: bold;
            color: #0A2E2A;
        }
        .plan-name {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #F9C80E;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌐 eSIM Payment Gateway</h1>
            <p>Taurixy Integration Test</p>
        </div>
        
        <div class="content">
            <div class="payment-form">
                <h2>Select eSIM Plan</h2>
                
                <div class="plan-card" data-plan="1" data-price="10" data-name="Basic Plan">
                    <div class="plan-name">Basic Plan</div>
                    <div class="plan-price">$10.00</div>
                    <div>1GB Data • 30 Days</div>
                </div>
                
                <div class="plan-card" data-plan="2" data-price="25" data-name="Standard Plan">
                    <div class="plan-name">Standard Plan</div>
                    <div class="plan-price">$25.00</div>
                    <div>5GB Data • 30 Days</div>
                </div>
                
                <div class="plan-card" data-plan="3" data-price="50" data-name="Premium Plan">
                    <div class="plan-name">Premium Plan</div>
                    <div class="plan-price">$50.00</div>
                    <div>Unlimited Data • 30 Days</div>
                </div>
                
                <h3>Customer Information</h3>
                
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" value="John" required>
                </div>
                
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" value="Doe" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" value="test@example.com" required>
                </div>
                
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" value="1234567890" required>
                </div>
                
                <div class="form-group">
                    <label for="paymentMethod">Payment Method</label>
                    <select id="paymentMethod">
                        <option value="BASIC_CARD">Credit/Debit Card</option>
                        <option value="BANK_TRANSFER">Bank Transfer</option>
                        <option value="CRYPTO">Cryptocurrency</option>
                    </select>
                </div>
                
                <button class="btn" onclick="createPayment()">💳 Create Payment</button>
            </div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Creating payment...</p>
            </div>
            
            <div class="result" id="result"></div>
        </div>
    </div>

    <script>
        let selectedPlan = null;
        
        // Plan selection
        document.querySelectorAll('.plan-card').forEach(card => {
            card.addEventListener('click', function() {
                document.querySelectorAll('.plan-card').forEach(c => c.classList.remove('selected'));
                this.classList.add('selected');
                selectedPlan = {
                    id: this.dataset.plan,
                    price: parseFloat(this.dataset.price),
                    name: this.dataset.name
                };
            });
        });
        
        // Select first plan by default
        document.querySelector('.plan-card').click();
        
        function showResult(message, type = 'info') {
            const result = document.getElementById('result');
            result.className = `result ${type}`;
            result.innerHTML = message;
            result.style.display = 'block';
        }
        
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }
        
        function formatPhone(phone) {
            // Remove all non-digits
            phone = phone.replace(/\D/g, '');
            
            // Add space after first 3 digits
            if (phone.length >= 3) {
                return phone.substring(0, 3) + ' ' + phone.substring(3);
            }
            
            return phone;
        }
        
        async function createPayment() {
            if (!selectedPlan) {
                showResult('Please select a plan first!', 'error');
                return;
            }
            
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const paymentMethod = document.getElementById('paymentMethod').value;
            
            if (!firstName || !lastName || !email || !phone) {
                showResult('Please fill in all required fields!', 'error');
                return;
            }
            
            showLoading(true);
            
            const paymentData = {
                plan_id: selectedPlan.id,
                payment_method: paymentMethod,
                customer_email: email,
                customer_first_name: firstName,
                customer_last_name: lastName,
                customer_phone: formatPhone(phone)
            };
            
            try {
                const response = await fetch('/api/payments/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(paymentData)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showResult(`
                        <h3>✅ Payment Created Successfully!</h3>
                        <p><strong>Payment ID:</strong> ${result.data.payment_id}</p>
                        <p><strong>Reference ID:</strong> ${result.data.reference_id}</p>
                        <p><strong>Amount:</strong> $${result.data.amount} ${result.data.currency}</p>
                        <p><strong>Status:</strong> ${result.data.state}</p>
                        <br>
                        <a href="${result.data.redirect_url}" target="_blank" class="btn" style="text-decoration: none; display: inline-block;">
                            🔗 Proceed to Payment
                        </a>
                    `, 'success');
                } else {
                    showResult(`
                        <h3>❌ Payment Creation Failed</h3>
                        <p><strong>Error:</strong> ${result.message}</p>
                        ${result.error ? `<p><strong>Details:</strong> ${result.error}</p>` : ''}
                    `, 'error');
                }
            } catch (error) {
                showResult(`
                    <h3>❌ Network Error</h3>
                    <p><strong>Error:</strong> ${error.message}</p>
                    <p>Please check your internet connection and try again.</p>
                `, 'error');
            } finally {
                showLoading(false);
            }
        }
        
        // Test direct API call if Laravel is not available
        async function testDirectAPI() {
            showLoading(true);
            
            const paymentData = {
                paymentType: 'DEPOSIT',
                amount: selectedPlan.price,
                currency: 'USD',
                referenceId: 'WEB-TEST-' + Date.now(),
                description: 'Web Test eSIM Purchase: ' + selectedPlan.name,
                returnUrl: window.location.origin + '/success',
                webhookUrl: 'https://engine-sandbox.taurixy.com/webhooks/xZXxn6LXpasDbTcdUN6u1TsDKzHR27Ky',
                customer: {
                    firstName: document.getElementById('firstName').value,
                    lastName: document.getElementById('lastName').value,
                    email: document.getElementById('email').value,
                    phone: formatPhone(document.getElementById('phone').value)
                }
            };
            
            try {
                const response = await fetch('https://engine-sandbox.taurixy.com/api/v1/payments', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer xZXxn6LXpasDbTcdUN6u1TsDKzHR27Ky',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(paymentData)
                });
                
                const result = await response.json();
                
                if (result.result) {
                    showResult(`
                        <h3>✅ Direct API Payment Created!</h3>
                        <p><strong>Payment ID:</strong> ${result.result.id}</p>
                        <p><strong>State:</strong> ${result.result.state}</p>
                        <p><strong>Amount:</strong> $${result.result.amount} ${result.result.currency}</p>
                        <br>
                        <a href="${result.result.redirectUrl}" target="_blank" class="btn" style="text-decoration: none; display: inline-block;">
                            🔗 Proceed to Payment
                        </a>
                    `, 'success');
                } else {
                    showResult(`
                        <h3>❌ Direct API Payment Failed</h3>
                        <p><strong>Error:</strong> ${result.message || 'Unknown error'}</p>
                    `, 'error');
                }
            } catch (error) {
                showResult(`
                    <h3>❌ Direct API Error</h3>
                    <p><strong>Error:</strong> ${error.message}</p>
                `, 'error');
            } finally {
                showLoading(false);
            }
        }
        
        // Add fallback button for direct API testing
        document.querySelector('.btn').insertAdjacentHTML('afterend', 
            '<button class="btn" onclick="testDirectAPI()" style="margin-top: 10px; background: #3A6351;">🔗 Test Direct API</button>'
        );
    </script>
</body>
</html>
