# Keep localhost on the main htdocs tree (must stay first).
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot "C:/xampp/htdocs"
    <Directory "C:/xampp/htdocs">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

# Local XAMPP: three storefronts, one codebase, one database.
# Include from C:/xampp/apache/conf/extra/httpd-vhosts.conf
# Hosts file:
#   127.0.0.1 travelsim.test
#   127.0.0.1 payersim.test
#   127.0.0.1 travelpal.test

<VirtualHost *:80>
    ServerName travelsim.test
    ServerAlias www.travelsim.test
    DocumentRoot "C:/xampp/htdocs/viserlab-esim-remake"
    <Directory "C:/xampp/htdocs/viserlab-esim-remake">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:80>
    ServerName payersim.test
    ServerAlias www.payersim.test
    DocumentRoot "C:/xampp/htdocs/viserlab-esim-remake"
    <Directory "C:/xampp/htdocs/viserlab-esim-remake">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:80>
    ServerName travelpal.test
    ServerAlias www.travelpal.test
    DocumentRoot "C:/xampp/htdocs/viserlab-esim-remake"
    <Directory "C:/xampp/htdocs/viserlab-esim-remake">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
