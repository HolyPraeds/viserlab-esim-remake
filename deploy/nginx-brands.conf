# Arena: same root and PHP as TravelSim. Do not create extra DBs or code copies.
# Copy server names onto the existing travelsim vhost, or add these extra
# server blocks that reuse the same root.

# Example extra HTTPS server (after certbot). Adjust ssl paths to match
# the existing /etc/nginx/sites-available/travelsim file.

server {
    listen 80;
    listen [::]:80;
    server_name payersim.com www.payersim.com travelpal.live www.travelpal.live;
    return 301 https://$host$request_uri;
}

# After: certbot --nginx -d payersim.com -d www.payersim.com -d travelpal.live -d www.travelpal.live
# Certbot will add 443 listen + ssl_certificate lines. Keep root identical:

# root /var/www/travelsim;
# index index.php;
# server_name travelsim.live www.travelsim.live payersim.com www.payersim.com travelpal.live www.travelpal.live;
